name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -ldflags "-X github.com/moveeeax/k8s-pdb-guard/cmd.Version=${GITHUB_REF_NAME}" -o k8s-pdb-guard .

      - name: Smoke test — blocking manifests exit non-zero
        run: |
          ./k8s-pdb-guard --version
          if ./k8s-pdb-guard lint ./examples/manifests; then
            echo "expected non-zero exit on blocking PDBs" >&2
            exit 1
          fi

      - name: Smoke test — healthy manifest exits zero
        run: ./k8s-pdb-guard lint ./examples/manifests/healthy.yaml